<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập JavaScript</title>
    <!-- tailwindcss -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- flowbite -->
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="pb-20 bg-cover bg-center bg-no-repeat bg-fixed"
    style="background-image: url(&quot;./img/hinh.avif&quot;)"
  >
    <div class="max-w-5xl mx-auto p-4 mt-10">
      <h1 class="text-3xl font-bold text-center text-white mb-8">
        BÀI TẬP JAVASCRIPT-ĐLHB
      </h1>
      <!-- Chuyển tab -->
      <ul
        class="mb-6 text-sm font-medium text-center text-gray-500 rounded-lg shadow-sm flex flex-col sm:flex-row dark:divide-gray-700 dark:text-gray-400"
        id="myTab"
        data-tabs-toggle="#myTabContent"
        role="tablist"
      >
        <li class="w-full focus-within:z-10" role="presentation">
          <button
            class="inline-block w-full p-4 bg-white border-r border-gray-200 sm:rounded-s-lg hover:text-gray-700 hover:bg-gray-50 focus:ring-4 focus:ring-blue-300 focus:outline-none"
            id="tuyensinh-tab"
            data-tabs-target="#tuyensinh"
            type="button"
            role="tab"
            aria-controls="tuyensinh"
            aria-selected="true"
          >
            Tuyển Sinh
          </button>
        </li>
        <li class="w-full focus-within:z-10" role="presentation">
          <button
            class="inline-block w-full p-4 bg-white border-r border-gray-200 hover:text-gray-700 hover:bg-gray-50 focus:ring-4 focus:ring-blue-300 focus:outline-none"
            id="tiendien-tab"
            data-tabs-target="#tiendien"
            type="button"
            role="tab"
            aria-controls="tiendien"
            aria-selected="false"
          >
            Tính Tiền Điện
          </button>
        </li>
        <li class="w-full focus-within:z-10" role="presentation">
          <button
            class="inline-block w-full p-4 bg-white border-r border-gray-200 hover:text-gray-700 hover:bg-gray-50 focus:ring-4 focus:ring-blue-300 focus:outline-none"
            id="tienthue-tab"
            data-tabs-target="#tienthue"
            type="button"
            role="tab"
            aria-controls="tienthue"
            aria-selected="false"
          >
            Tính Tiền Thuế
          </button>
        </li>
        <li class="w-full focus-within:z-10" role="presentation">
          <button
            class="inline-block w-full p-4 bg-white border-s-0 border-gray-200 sm:rounded-e-lg hover:text-gray-700 hover:bg-gray-50 focus:ring-4 focus:outline-none focus:ring-blue-300"
            id="tiencap-tab"
            data-tabs-target="#tiencap"
            type="button"
            role="tab"
            aria-controls="tiencap"
            aria-selected="false"
          >
            Tính Tiền Cáp
          </button>
        </li>
      </ul>
      <div id="myTabContent">
        <!-- Tuyển sinh -->
        <div
          class="hidden"
          id="tuyensinh"
          role="tabpanel"
          aria-labelledby="tuyensinh-tab"
        >
          <div
            class="max-w-4xl mx-auto p-8 bg-[#f4f7f6] rounded-2xl shadow-lg border border-gray-200"
          >
            <h1
              class="text-2xl font-bold text-gray-700 mb-6 flex items-center gap-2"
            >
              Quản lý tuyển sinh
            </h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
              <input
                id="n_diemChuan"
                type="number"
                placeholder="Điểm chuẩn"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm"
              />
              <select
                id="area"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm text-gray-500"
              >
                <option value="X" selected>Chọn khu vực</option>
                <option value="A">Khu vực A</option>
                <option value="B">Khu vực B</option>
                <option value="C">Khu vực C</option>
              </select>
              <select
                id="doiTuong"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm text-gray-500"
              >
                <option value="0" selected>Chọn đối tượng</option>
                <option value="1">Đối tượng 1</option>
                <option value="2">Đối tượng 2</option>
                <option value="3">Đối tượng 3</option>
              </select>
              <input
                id="n_diem1"
                type="number"
                placeholder="Điểm môn thứ 1"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm"
              />
              <input
                id="n_diem2"
                type="number"
                placeholder="Điểm môn thứ 2"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm"
              />
              <input
                id="n_diem3"
                type="number"
                placeholder="Điểm môn thứ 3"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm"
              />
            </div>
            <button
              onclick="tinhDiem()"
              class="text-white bg-blue-500 hover:bg-blue-600 focus:ring-4 focus:ring-blue-300 font-medium rounded-full text-sm px-8 py-2.5 mb-6 focus:outline-none transition-all shadow-md"
            >
              Kết Quả
            </button>
            <div
              class="p-4 text-sm text-green-800 rounded-lg bg-[#e6f4ea] border border-green-200 flex items-center gap-2"
            >
              <p id="showInfo_1" class="font-medium empty:hidden"></p>
            </div>
          </div>
        </div>

        <!-- Tiền điện -->
        <div
          class="hidden"
          id="tiendien"
          role="tabpanel"
          aria-labelledby="tiendien-tab"
        >
          <div
            class="max-w-4xl mx-auto p-8 bg-[#f4f7f6] rounded-2xl shadow-lg border border-gray-200"
          >
            <h1
              class="text-2xl font-bold text-gray-700 mb-6 flex items-center gap-2"
            >
              Tính tiền điện
            </h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
              <input
                id="nhapHoTen1"
                type="text"
                placeholder="Nhập họ tên"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm"
              />
              <input
                id="nhapSokw"
                type="number"
                placeholder="Nhập số kw"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm"
              />
            </div>
            <button
              onclick="tinhTienDien()"
              class="text-white bg-blue-500 hover:bg-blue-600 focus:ring-4 focus:ring-blue-300 font-medium rounded-full text-sm px-8 py-2.5 mb-6 focus:outline-none transition-all shadow-md"
            >
              Tính tiền điện
            </button>
            <div
              class="p-4 text-sm text-green-800 rounded-lg bg-[#e6f4ea] border border-green-200 flex items-center gap-2"
            >
              <p id="showInfo_2" class="font-medium empty:hidden"></p>
            </div>
          </div>
        </div>

        <!-- Tính thuế thu nhập cá nhân -->
        <div
          class="hidden"
          id="tienthue"
          role="tabpanel"
          aria-labelledby="tienthue-tab"
        >
          <div
            class="max-w-4xl mx-auto p-8 bg-[#f4f7f6] rounded-2xl shadow-lg border border-gray-200"
          >
            <h1
              class="text-2xl font-bold text-gray-700 mb-6 flex items-center gap-2"
            >
              Tính tiền thuế
            </h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
              <input
                id="nhapHoTen2"
                type="text"
                placeholder="Nhập họ tên"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm"
              />
              <input
                id="thuNhap"
                type="number"
                placeholder="Tổng thu nhập năm"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm"
              />
              <input
                id="nguoiPhuThuoc"
                type="number"
                placeholder="Số người phụ thuộc"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm"
              />
            </div>
            <button
              onclick="tinhTienThue()"
              class="text-white bg-blue-500 hover:bg-blue-600 focus:ring-4 focus:ring-blue-300 font-medium rounded-full text-sm px-8 py-2.5 mb-6 focus:outline-none transition-all shadow-md"
            >
              Tính tiền thuế
            </button>
            <div
              class="p-4 text-sm text-green-800 rounded-lg bg-[#e6f4ea] border border-green-200 flex items-center gap-2"
            >
              <p id="showInfo_3" class="font-medium empty:hidden"></p>
            </div>
          </div>
        </div>

        <!-- Tính tiền cáp -->
        <div
          class="hidden"
          id="tiencap"
          role="tabpanel"
          aria-labelledby="tiencap-tab"
        >
          <div
            class="max-w-4xl mx-auto p-8 bg-[#f4f7f6] rounded-2xl shadow-lg border border-gray-200"
          >
            <h1
              class="text-2xl font-bold text-gray-700 mb-6 flex items-center gap-2"
            >
              Tính tiền cáp
            </h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
              <select
                id="loaiKhachHang"
                onchange="hienThiKetNoi()"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm text-gray-500"
              >
                <option value="type0" selected>Chọn loại khách hàng</option>
                <option value="nhaDan">Nhà dân</option>
                <option value="doanhNghiep">Doanh nghiệp</option>
              </select>
              <input
                id="maKhachHang"
                type="text"
                placeholder="Nhập mã khách hàng"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm"
              />
              <input
                id="soKenh"
                type="number"
                placeholder="Số kênh cao cấp"
                class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3 shadow-sm"
              />
              <input
                id="soKetNoi"
                type="number"
                placeholder="Số kết nối"
                class="hidden bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 w-full p-3 shadow-sm"
                style="display: none"
              />
            </div>
            <button
              onclick="tinhTienCap()"
              class="text-white bg-blue-500 hover:bg-blue-600 focus:ring-4 focus:ring-blue-300 font-medium rounded-full text-sm px-8 py-2.5 mb-6 focus:outline-none transition-all shadow-md"
            >
              Tính tiền cáp
            </button>
            <div
              class="p-4 text-sm text-green-800 rounded-lg bg-[#e6f4ea] border border-green-200 flex items-center gap-2"
            >
              <p id="showInfo_4" class="font-medium empty:hidden"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script src="./js/tienCap.js"></script>
    <script src="./js/tienDien.js"></script>
    <script src="./js/tienThue.js"></script>
    <script src="./js/tuyenSinh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
  </body>
</html>
